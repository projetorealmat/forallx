name: Compile forallx PDF
description: Install XeLaTeX, validate editorial placeholders and compile forallx.tex
runs:
  using: composite
  steps:
    - name: Verificar marcadores editoriais provisórios
      shell: bash
      run: python3 scripts/check_editorial_placeholders.py .

    - name: Verificar espaços indevidos nas alterações
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [[ "${EVENT_NAME}" == "pull_request" ]]; then
          git diff --check "${BASE_SHA}" "${GITHUB_SHA}"
        else
          git diff-tree --check --no-commit-id -r "${GITHUB_SHA}"
        fi
    - name: Instalar TeX Live com XeLaTeX
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-english \
          texlive-lang-portuguese \
          texlive-xetex \
          latexmk

    - name: Registrar ambiente de compilação
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'Runner: ubuntu-24.04\n'
          printf 'XeLaTeX: '
          xelatex --version | head -n1
          printf 'latexmk: '
          latexmk --version | head -n1
          printf 'TeX engine: '
          kpsewhich --version | head -n1
        } > forallx-build-environment.txt

    - name: Compilar forallx.tex com XeLaTeX
      shell: bash
      run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error forallx.tex

    - name: Impedir referências LaTeX não resolvidas
      shell: bash
      run: |
        if grep -nE 'Reference .* undefined|There were undefined references' forallx.log; then
          echo 'Foram encontradas referências LaTeX não resolvidas.'
          exit 1
        fi
