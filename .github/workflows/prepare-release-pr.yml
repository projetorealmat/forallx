name: Preparar Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Próxima versão, sem o prefixo v (ex.: 0.1.3)"
        required: true
        type: string
      release_date:
        description: "Data da publicação em AAAA-MM-DD"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: projetorealmat/.github/.github/workflows/book-prepare-release.yml@v3
    with:
      config: .realmat/book.json
      version: ${{ inputs.version }}
      release_date: ${{ inputs.release_date }}
    secrets: inherit
