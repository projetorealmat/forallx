name: REALMat — verificar livro
# O caller usa a tag imutável @v3 do contrato central REALMat.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: projetorealmat/.github/.github/workflows/book-ci.yml@v3
    with:
      config: .realmat/book.json
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
