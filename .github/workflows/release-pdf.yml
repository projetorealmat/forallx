name: Publicar release do livro

on:
  push:
    branches:
      - main
    paths:
      - CITATION.cff

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detectar nova versão
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_date: ${{ steps.release.outputs.release_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detectar mudança de versão no CITATION.cff
        id: release
        shell: bash
        run: |
          set -euo pipefail

          extract_field() {
            local field="$1"
            local file="$2"
            python3 - "${field}" "${file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          field, path = sys.argv[1:]
          text = Path(path).read_text(encoding="utf-8")
          match = re.search(
              rf"""^{re.escape(field)}:\s*["']?([^\s"']+)["']?\s*$""",
              text,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit(f"CITATION.cff não contém um campo {field} válido.")
          print(match.group(1))
          PY
          }

          current_version="$(extract_field version CITATION.cff)"
          release_date="$(extract_field date-released CITATION.cff)"

          if [[ ! "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A versão do CITATION.cff deve seguir MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ ! "${release_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date-released deve seguir AAAA-MM-DD."
            exit 1
          fi

          previous_version=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git show HEAD^:CITATION.cff > "${RUNNER_TEMP}/previous-CITATION.cff" 2>/dev/null; then
              previous_version="$(extract_field version "${RUNNER_TEMP}/previous-CITATION.cff")"
            fi
          fi

          release_tag="v${current_version}"
          publish=true
          if [[ -n "${previous_version}" && "${current_version}" == "${previous_version}" ]]; then
            publish=false
            echo "A versão do CITATION.cff não mudou; nenhuma release será criada."
          else
            echo "Nova versão detectada: ${release_tag}."
          fi

          {
            echo "publish=${publish}"
            echo "release_tag=${release_tag}"
            echo "release_version=${current_version}"
            echo "release_date=${release_date}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Build and publish release
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.detect.outputs.release_version }}
      RELEASE_DATE: ${{ needs.detect.outputs.release_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar versão e destino da publicação
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must follow vMAJOR.MINOR.PATCH."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "A publicação deve apontar para um commit já contido em main."
            exit 1
          fi

          citation_line="$(grep -E '^version:' CITATION.cff | head -n1)"
          expected_version="$(printf '%s' "$RELEASE_TAG" | cut -c2-)"
          if [[ "$expected_version" != "$RELEASE_VERSION" ]]; then
            echo "A versão detectada ($RELEASE_VERSION) não coincide com a tag esperada ($expected_version)."
            exit 1
          fi
          if [[ "$citation_line" != "version: \"$RELEASE_VERSION\"" ]]; then
            echo "A versão do CITATION.cff não coincide com a versão publicada."
            exit 1
          fi
          if [[ "$RELEASE_DATE" != "$(grep -E '^date-released:' CITATION.cff | awk '{print $2}')" ]]; then
            echo "A data do CITATION.cff não coincide com a data detectada."
            exit 1
          fi

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail

          release_date_iso="$RELEASE_DATE"
          release_date_display="$(date -u -d "${release_date_iso}" +%d/%m/%Y)"
          release_major="${RELEASE_TAG#v}"
          release_major="${release_major%%.*}"
          release_status="em revisão"
          release_is_prerelease=false

          case "${release_major}" in
            0)
              release_status="em revisão"
              release_is_prerelease=true
              ;;
            1)
              if [[ "${RELEASE_TAG}" == "v1.0.0" ]]; then
                release_status="tradução aprovada"
              else
                release_status="versão revisada"
              fi
              ;;
            *)
              release_status="nova versão"
              ;;
          esac

          {
            printf '\\renewcommand*{\\editionversion}{%s}\n' "${RELEASE_TAG}"
            printf '\\renewcommand*{\\editiondate}{%s}\n' "${release_date_display}"
            printf '\\renewcommand*{\\editionstatus}{%s}\n' "${release_status}"
          } > forallx-build-metadata.tex

          release_metadata="forallx-${RELEASE_TAG}-metadata.txt"
          {
            printf 'Livro: forallx — Introdução à lógica formal\n'
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${release_date_display}"
            printf 'Status editorial: %s\n' "${release_status}"
            printf 'Commit: %s\n' "${GITHUB_SHA}"
            printf 'Repositório: https://github.com/${GITHUB_REPOSITORY}\n'
            printf 'Licença: Creative Commons Attribution 4.0 International\n'
          } > "${release_metadata}"

          echo "RELEASE_METADATA=${release_metadata}" >> "${GITHUB_ENV}"
          echo "RELEASE_STATUS=${release_status}" >> "${GITHUB_ENV}"
          echo "RELEASE_DATE=${release_date_iso}" >> "${GITHUB_ENV}"
          echo "RELEASE_IS_PRERELEASE=${release_is_prerelease}" >> "${GITHUB_ENV}"
          cat forallx-build-metadata.tex
          cat "${release_metadata}"

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Verificar metadados incorporados no PDF
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout forallx.pdf release-pdf-text.txt
          if ! grep -Fq "Edição brasileira: ${RELEASE_TAG}" release-pdf-text.txt; then
            echo "A versão da release não foi incorporada ao PDF."
            exit 1
          fi
          if ! grep -Fq "Status editorial: ${RELEASE_STATUS}" release-pdf-text.txt; then
            echo "O status editorial da release não foi incorporado ao PDF."
            exit 1
          fi

      - name: Registrar ambiente de compilação na metadata
        shell: bash
        run: |
          set -euo pipefail
          cat forallx-build-environment.txt >> "${RELEASE_METADATA}"

      - name: Package reproducible source and checksums
        shell: bash
        run: |
          set -euo pipefail

          source_dir="forallx-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"

          git archive --format=tar --prefix="${source_dir}/" "${GITHUB_SHA}" | tar -x
          cp forallx-build-metadata.tex "${source_dir}/"
          cp "${RELEASE_METADATA}" "${source_dir}/"
          cp forallx-build-environment.txt "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"

          sha256sum forallx.pdf "${source_asset}" "${RELEASE_METADATA}" forallx-build-environment.txt > SHA256SUMS

      - name: Criar ou validar tag da release
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "${existing_commit}" != "${GITHUB_SHA}" ]]; then
              echo "A tag ${RELEASE_TAG} já existe e aponta para outro commit."
              exit 1
            fi
            echo "A tag ${RELEASE_TAG} já aponta para este commit; continuando."
          else
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "forallx ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          source_asset="forallx-${RELEASE_TAG}-source.tar.gz"
          release_assets=("forallx.pdf" "${source_asset}" "${RELEASE_METADATA}" "forallx-build-environment.txt" "SHA256SUMS")

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; preserving its notes and uploading missing assets."
            existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"

            for asset in "${release_assets[@]}"; do
              if grep -Fxq "${asset}" <<< "${existing_assets}"; then
                echo "Asset ${asset} already exists; keeping it."
              else
                gh release upload "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"
              fi
            done

            is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
            fi

            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease
            else
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease=false
            fi
          else
            release_flags=()
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" forallx.pdf "${source_asset}" "${RELEASE_METADATA}" forallx-build-environment.txt SHA256SUMS --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "forallx ${RELEASE_TAG} — ${RELEASE_STATUS}" --generate-notes "${release_flags[@]}"
          fi

      - name: Propor atualização do catálogo REALMat
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PORTAL_DISPATCH_TOKEN}" ]]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN não configurado; a atualização do catálogo continuará manual."
            exit 0
          fi

          published_dir="${RUNNER_TEMP}/forallx-release-asset"
          mkdir -p "${published_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "forallx.pdf" \
            --dir "${published_dir}" \
            --clobber
          published_pdf="${published_dir}/forallx.pdf"
          if [[ ! -f "${published_pdf}" ]]; then
            echo "PDF publicado não foi encontrado após a release."
            exit 1
          fi
          export PDF_SHA256="$(sha256sum "${published_pdf}" | awk '{print $1}')"

          python3 scripts/build_catalog_dispatch.py > /tmp/catalog-dispatch.json

          if ! curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PORTAL_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/catalog-dispatch.json \
            https://api.github.com/repos/projetorealmat/projetorealmat.github.io/dispatches; then
            echo "::warning::Não foi possível propor a atualização automática do catálogo; a release foi publicada e pode ser sincronizada manualmente."
          fi
