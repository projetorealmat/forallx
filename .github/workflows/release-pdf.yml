name: Publicar release do livro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and release target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must follow vMAJOR.MINOR.PATCH."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "The release tag must point to a commit already contained in main."
            exit 1
          fi

          citation_version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*$/\1/p' CITATION.cff | head -n1)"
          expected_version="${RELEASE_TAG#v}"
          if [[ "${citation_version}" != "${expected_version}" ]]; then
            echo "CITATION.cff version (${citation_version}) must match the release tag (${expected_version})."
            exit 1
          fi

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_date_iso="$(TZ=America/Maceio date +%F)"
          release_date_display="$(TZ=America/Maceio date +%d/%m/%Y)"
          release_major="${RELEASE_TAG#v}"
          release_major="${release_major%%.*}"
          release_status="em revisão"
          release_is_prerelease=false

          case "${release_major}" in
            0)
              release_status="em revisão"
              release_is_prerelease=true
              ;;
            1)
              if [[ "${RELEASE_TAG}" == "v1.0.0" ]]; then
                release_status="tradução aprovada"
              else
                release_status="versão revisada"
              fi
              ;;
            *)
              release_status="nova versão"
              ;;
          esac

          {
            printf '\\renewcommand*{\\editionversion}{%s}\n' "${RELEASE_TAG}"
            printf '\\renewcommand*{\\editiondate}{%s}\n' "${release_date_display}"
            printf '\\renewcommand*{\\editionstatus}{%s}\n' "${release_status}"
          } > forallx-build-metadata.tex

          release_metadata="forallx-${RELEASE_TAG}-metadata.txt"
          {
            printf 'Livro: forallx — Introdução à lógica formal\n'
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${release_date_display}"
            printf 'Status editorial: %s\n' "${release_status}"
            printf 'Commit: %s\n' "${GITHUB_SHA}"
            printf 'Repositório: https://github.com/${GITHUB_REPOSITORY}\n'
            printf 'Licença: Creative Commons Attribution 4.0 International\n'
          } > "${release_metadata}"

          echo "RELEASE_METADATA=${release_metadata}" >> "${GITHUB_ENV}"
          echo "RELEASE_STATUS=${release_status}" >> "${GITHUB_ENV}"
          echo "RELEASE_DATE=${release_date_iso}" >> "${GITHUB_ENV}"
          echo "RELEASE_IS_PRERELEASE=${release_is_prerelease}" >> "${GITHUB_ENV}"
          cat forallx-build-metadata.tex
          cat "${release_metadata}"

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Registrar ambiente de compilação na metadata
        shell: bash
        run: |
          set -euo pipefail
          cat forallx-build-environment.txt >> "${RELEASE_METADATA}"

      - name: Package reproducible source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_dir="forallx-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"

          git archive --format=tar --prefix="${source_dir}/" "${GITHUB_SHA}" | tar -x
          cp forallx-build-metadata.tex "${source_dir}/"
          cp "${RELEASE_METADATA}" "${source_dir}/"
          cp forallx-build-environment.txt "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"

          sha256sum forallx.pdf "${source_asset}" "${RELEASE_METADATA}" forallx-build-environment.txt > SHA256SUMS

      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_asset="forallx-${RELEASE_TAG}-source.tar.gz"
          release_assets=("forallx.pdf" "${source_asset}" "${RELEASE_METADATA}" "forallx-build-environment.txt" "SHA256SUMS")

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; preserving its notes and uploading missing assets."
            existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"

            for asset in "${release_assets[@]}"; do
              if grep -Fxq "${asset}" <<< "${existing_assets}"; then
                echo "Asset ${asset} already exists; keeping it."
              else
                gh release upload "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"
              fi
            done

            is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
            fi

            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease
            else
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease=false
            fi
          else
            release_flags=()
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" forallx.pdf "${source_asset}" "${RELEASE_METADATA}" forallx-build-environment.txt SHA256SUMS --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "forallx ${RELEASE_TAG} — ${RELEASE_STATUS}" --generate-notes "${release_flags[@]}"
          fi

      - name: Propor atualização do catálogo REALMat
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "${PORTAL_DISPATCH_TOKEN}" ]]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN não configurado; a atualização do catálogo continuará manual."
            exit 0
          fi

          published_dir="${RUNNER_TEMP}/forallx-release-asset"
          mkdir -p "${published_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "forallx.pdf" \
            --dir "${published_dir}" \
            --clobber
          published_pdf="${published_dir}/forallx.pdf"
          if [[ ! -f "${published_pdf}" ]]; then
            echo "PDF publicado não foi encontrado após a release."
            exit 1
          fi
          export PDF_SHA256="$(sha256sum "${published_pdf}" | awk '{print $1}')"

          python3 scripts/build_catalog_dispatch.py > /tmp/catalog-dispatch.json

          if ! curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PORTAL_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/catalog-dispatch.json \
            https://api.github.com/repos/projetorealmat/projetorealmat.github.io/dispatches; then
            echo "::warning::Não foi possível propor a atualização automática do catálogo; a release foi publicada e pode ser sincronizada manualmente."
          fi
