name: Publicar release do livro

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validar Release PR e metadados
        shell: bash
        run: |
          set -euo pipefail

          extract_field() {
            local field="$1"
            local file="$2"
            python3 - "${field}" "${file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          field, path = sys.argv[1:]
          text = Path(path).read_text(encoding="utf-8")
          match = re.search(
              rf"""^{re.escape(field)}:\s*["']?([^\s"']+)["']?\s*$""",
              text,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit(f"CITATION.cff não contém um campo {field} válido.")
          print(match.group(1))
          PY
          }

          release_version="$(extract_field version CITATION.cff)"
          release_date="$(extract_field date-released CITATION.cff)"
          release_tag="v${release_version}"

          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A versão do CITATION.cff deve seguir MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ ! "${release_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date-released deve seguir AAAA-MM-DD."
            exit 1
          fi
          if ! date -u -d "${release_date}" +%F >/dev/null 2>&1; then
            echo "date-released não representa uma data válida."
            exit 1
          fi

          expected_branch="release/${release_tag}"
          if [[ "${RELEASE_BRANCH}" != "${expected_branch}" ]]; then
            echo "A Release PR deve usar a branch ${expected_branch}; branch recebida: ${RELEASE_BRANCH}."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "origin/main"; then
            echo "O commit da Release PR deve estar contido em main antes da publicação."
            exit 1
          fi

          if git show "${RELEASE_COMMIT}^:CITATION.cff" > "${RUNNER_TEMP}/previous-CITATION.cff" 2>/dev/null; then
            previous_version="$(extract_field version "${RUNNER_TEMP}/previous-CITATION.cff")"
            if [[ "${release_version}" == "${previous_version}" ]]; then
              echo "A Release PR não alterou a versão do CITATION.cff."
              exit 1
            fi
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "A tag ${release_tag} já existe; releases são imutáveis e não podem ser reutilizadas."
            exit 1
          fi

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_VERSION=${release_version}"
            echo "RELEASE_DATE=${release_date}"
          } >> "${GITHUB_ENV}"

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail

          release_date_display="$(date -u -d "${RELEASE_DATE}" +%d/%m/%Y)"
          release_major="${RELEASE_TAG#v}"
          release_major="${release_major%%.*}"
          release_status="em revisão"
          release_is_prerelease=false

          case "${release_major}" in
            0)
              release_status="em revisão"
              release_is_prerelease=true
              ;;
            1)
              if [[ "${RELEASE_TAG}" == "v1.0.0" ]]; then
                release_status="tradução aprovada"
              else
                release_status="versão revisada"
              fi
              ;;
            *)
              release_status="nova versão"
              ;;
          esac

          {
            printf '\\renewcommand*{\\editionversion}{%s}\n' "${RELEASE_TAG}"
            printf '\\renewcommand*{\\editiondate}{%s}\n' "${release_date_display}"
            printf '\\renewcommand*{\\editionstatus}{%s}\n' "${release_status}"
          } > forallx-build-metadata.tex

          release_metadata="forallx-${RELEASE_TAG}-metadata.txt"
          {
            printf 'Livro: forallx — Introdução à lógica formal\n'
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${release_date_display}"
            printf 'Status editorial: %s\n' "${release_status}"
            printf 'Commit: %s\n' "${RELEASE_COMMIT}"
            printf 'Release PR: #%s\n' "${{ github.event.pull_request.number }}"
            printf 'Repositório: https://github.com/%s\n' "${GITHUB_REPOSITORY}"
            printf 'Licença: Creative Commons Attribution 4.0 International\n'
          } > "${release_metadata}"

          echo "RELEASE_METADATA=${release_metadata}" >> "${GITHUB_ENV}"
          echo "RELEASE_STATUS=${release_status}" >> "${GITHUB_ENV}"
          echo "RELEASE_IS_PRERELEASE=${release_is_prerelease}" >> "${GITHUB_ENV}"
          cat forallx-build-metadata.tex
          cat "${release_metadata}"

      - name: Validar e compilar PDF final
        uses: ./.github/actions/compile-pdf

      - name: Verificar metadados incorporados no PDF
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout forallx.pdf release-pdf-text.txt
          if ! grep -Fq "Edição brasileira: ${RELEASE_TAG}" release-pdf-text.txt; then
            echo "A versão da release não foi incorporada ao PDF."
            exit 1
          fi
          if ! grep -Fq "Status editorial: ${RELEASE_STATUS}" release-pdf-text.txt; then
            echo "O status editorial da release não foi incorporado ao PDF."
            exit 1
          fi

      - name: Registrar ambiente de compilação na metadata
        shell: bash
        run: |
          set -euo pipefail
          cat forallx-build-environment.txt >> "${RELEASE_METADATA}"

      - name: Package reproducible source and checksums
        shell: bash
        run: |
          set -euo pipefail

          source_dir="forallx-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"

          git archive --format=tar --prefix="${source_dir}/" "${RELEASE_COMMIT}" | tar -x
          cp forallx-build-metadata.tex "${source_dir}/"
          cp "${RELEASE_METADATA}" "${source_dir}/"
          cp forallx-build-environment.txt "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"

          sha256sum forallx.pdf "${source_asset}" "${RELEASE_METADATA}" forallx-build-environment.txt > SHA256SUMS

      - name: Criar tag imutável da release
        shell: bash
        run: |
          set -euo pipefail

          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "forallx ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Criar Release como draft e anexar assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          source_asset="forallx-${RELEASE_TAG}-source.tar.gz"
          release_flags=(--draft)
          if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_COMMIT}" \
            --title "forallx ${RELEASE_TAG} — ${RELEASE_STATUS}" \
            --generate-notes \
            "${release_flags[@]}"

          gh release upload "${RELEASE_TAG}" \
            forallx.pdf \
            "${source_asset}" \
            "${RELEASE_METADATA}" \
            forallx-build-environment.txt \
            SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease
          else
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease=false
          fi

      - name: Propor atualização do catálogo REALMat
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PORTAL_DISPATCH_TOKEN}" ]]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN não configurado; a atualização do catálogo continuará manual."
            exit 0
          fi

          published_dir="${RUNNER_TEMP}/forallx-release-asset"
          mkdir -p "${published_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "forallx.pdf" \
            --dir "${published_dir}" \
            --clobber
          published_pdf="${published_dir}/forallx.pdf"
          if [[ ! -f "${published_pdf}" ]]; then
            echo "PDF publicado não foi encontrado após a release."
            exit 1
          fi
          export PDF_SHA256="$(sha256sum "${published_pdf}" | awk '{print $1}')"

          python3 scripts/build_catalog_dispatch.py > /tmp/catalog-dispatch.json

          if ! curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PORTAL_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/catalog-dispatch.json \
            https://api.github.com/repos/projetorealmat/projetorealmat.github.io/dispatches; then
            echo "::warning::Não foi possível propor a atualização automática do catálogo; a release foi publicada e pode ser sincronizada manualmente."
          fi
