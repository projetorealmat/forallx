name: Publish PDF Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must follow vMAJOR.MINOR.PATCH."
            exit 1
          fi

          release_date="$(TZ=America/Maceio date +%d/%m/%Y)"
          {
            printf '\\renewcommand*{\\editionversion}{%s}\n' "${GITHUB_REF_NAME}"
            printf '\\renewcommand*{\\editiondate}{%s}\n' "${release_date}"
          } > forallx-build-metadata.tex
          cat forallx-build-metadata.tex

      - name: Install TeX Live with XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-lang-portuguese \
            texlive-xetex \
            latexmk

      - name: Compile forallx.tex with XeLaTeX
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error forallx.tex

      - name: Fail on unresolved references
        run: |
          if grep -nE 'Reference .* undefined|There were undefined references' forallx.log; then
            echo 'Unresolved LaTeX references detected.'
            exit 1
          fi

      - name: Package reproducible source
        run: |
          set -euo pipefail
          source_dir="forallx-${GITHUB_REF_NAME}-source"
          source_asset="${source_dir}.tar.gz"
          mkdir "${source_dir}"
          git archive "${GITHUB_SHA}" | tar -x -C "${source_dir}"
          cp forallx-build-metadata.tex "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_asset="forallx-${GITHUB_REF_NAME}-source.tar.gz"

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" forallx.pdf "${source_asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" forallx.pdf "${source_asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "forallx ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
