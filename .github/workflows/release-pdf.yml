name: Publicar release do livro

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Número da Release PR já mesclada (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    uses: projetorealmat/.github/.github/workflows/book-publish-release.yml@main
    with:
      config: .realmat/book.json
      release_pr: ${{ inputs.release_pr || '' }}
    secrets: inherit
