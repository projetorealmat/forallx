name: Build and Validate PDF

on:
  # Todo pull request, inclusive uma Release PR, valida o PDF candidato.
  # A compilação final de publicação ocorre somente após o merge de uma Release PR.
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verificar política de releases
        run: python3 scripts/test_release_workflow_policy.py

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forallx-pdf-${{ github.sha }}
          path: forallx.pdf
          if-no-files-found: error
