name: Build and Validate PDF

on:
  # Todo pull request, inclusive uma Release PR, valida o PDF candidato.
  # A compilação final de publicação ocorre somente após o merge de uma Release PR.
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verificar política de releases
        run: python3 scripts/test_release_workflow_policy.py

      - name: Reservar versionamento para Release PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "${BASE_REF}"
          git show "origin/${BASE_REF}:CITATION.cff" > "${RUNNER_TEMP}/base-CITATION.cff"

          python3 - "${RUNNER_TEMP}/base-CITATION.cff" CITATION.cff "${HEAD_REF}" <<'PY'
          import re
          import sys
          from datetime import date
          from pathlib import Path

          base_path, current_path, head_ref = sys.argv[1:]

          def field(path: str, name: str) -> str:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(
                  rf"""^{re.escape(name)}:\s*["']?([^\s"']+)["']?\s*$""",
                  text,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(f"{path} não contém um campo {name} válido.")
              return match.group(1)

          def release_date(value: str, path: str) -> date:
              try:
                  return date.fromisoformat(value)
              except ValueError as error:
                  raise SystemExit(
                      f"{path} contém date-released inválida: {value}."
                  ) from error

          base_version = field(base_path, "version")
          current_version = field(current_path, "version")
          base_date = field(base_path, "date-released")
          current_date = field(current_path, "date-released")
          base_release_date = release_date(base_date, base_path)
          current_release_date = release_date(current_date, current_path)

          release_metadata_changed = (
              base_version != current_version or base_date != current_date
          )
          is_release_pr = re.fullmatch(r"release/v\d+\.\d+\.\d+", head_ref) is not None

          if release_metadata_changed and not is_release_pr:
              raise SystemExit(
                  "version/date-released só podem mudar em uma Release PR "
                  "com branch release/vMAJOR.MINOR.PATCH."
              )

          if is_release_pr:
              expected = f"release/v{current_version}"
              if head_ref != expected:
                  raise SystemExit(
                      f"A branch {head_ref} não coincide com a versão declarada; esperado: {expected}."
                  )
              if base_version == current_version:
                  raise SystemExit("A Release PR deve aumentar a versão do CITATION.cff.")
              if current_release_date < base_release_date:
                  raise SystemExit(
                      "date-released da nova versão não pode ser anterior à release atual."
                  )
          PY

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forallx-pdf-${{ github.sha }}
          path: forallx.pdf
          if-no-files-found: error
