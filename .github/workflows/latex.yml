name: Build and Validate PDF

on:
  # Branch pushes only; release tags use release-pdf.yml.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: forallx-pdf-${{ github.sha }}
          path: forallx.pdf
          if-no-files-found: error
