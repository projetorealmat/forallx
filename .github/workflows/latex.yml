name: Build and Validate PDF

on:
  # Branch pushes only; release tags use release-pdf.yml.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar e compilar PDF
        uses: ./.github/actions/compile-pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: forallx-pdf-${{ github.sha }}
          path: forallx.pdf
          if-no-files-found: error
